[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-prefix-cache-eval"
version = "0.1.0"
description = "Request-level prefix cache evaluation for agent model-dataset runs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mini-swe-agent==2.4.6",
  "datacurve-pier @ git+https://github.com/datacurve-ai/pier.git@4d3c14041d16443f3f9f460dcdf23629994a304e",
  "litellm==1.83.0",
  "openai==2.32.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
